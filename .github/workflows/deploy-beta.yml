name: Deploy beta
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      initialize:
        description: First deployment only; starts with zero service tasks for migration
        type: boolean
        default: false
permissions: { contents: read, id-token: write }
concurrency:
  group: deploy-beta
  cancel-in-progress: false
jobs:
  deploy:
    environment: beta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -r requirements-prod.txt
      - run: python manage.py test
      - working-directory: frontend/web
        run: npm ci && npm run typecheck
      - working-directory: infra/cdk
        run: npm ci && npm run build && npm test
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}, aws-region: ap-southeast-2 }
      - name: Deploy, migrate, wait, and smoke-test
        env:
          INITIALIZE: ${{ inputs.initialize }}
        run: |
          if [ "$INITIALIZE" = "true" ]; then
            python scripts/deploy_beta.py --initialize
          else
            python scripts/deploy_beta.py
          fi
