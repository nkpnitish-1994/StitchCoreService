name: Deploy production
on:
  workflow_dispatch:
    inputs: { ref: { description: "Validated main commit SHA", required: true, type: string } }
permissions: { contents: read, id-token: write }
jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ inputs.ref }} }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}, aws-region: ap-southeast-2 }
      - working-directory: infra/cdk
        run: npm install && npx cdk deploy --all -c env=production
      - run: echo "Run production-safe smoke tests only; do not seed data or send live provider notifications."

